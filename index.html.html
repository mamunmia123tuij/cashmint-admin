<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash Mint BD - Admin Panel</title>
<style>
:root{
  --bg:#F4F7FB; --card:#FFFFFF; --text:#1B2430; --muted:#7C8794; --border:#E6EBF1;
  --primary:#0FA958; --primary-d:#0B8A47; --primary-l:#E6F7EE; --danger:#E5484D; --danger-l:#FDE8E8;
  --warn:#F59E0B; --warn-l:#FFF3D6; --info:#2F80ED; --info-l:#E8F1FE; --shadow:0 2px 10px rgba(20,40,70,.06);
}
body.dark{
  --bg:#0F1620; --card:#17202C; --text:#E8EEF5; --muted:#8FA0B3; --border:#263243;
  --primary-l:#12301F; --danger-l:#3A1B1E; --warn-l:#3A2E12; --info-l:#14263F; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
.hidden{display:none!important}
button{font-family:inherit}
a{color:var(--primary)}
.muted{color:var(--muted)}
.pre{white-space:pre-wrap;margin:0}
.center{display:flex;align-items:center;justify-content:center}
.center-pad{display:flex;align-items:center;justify-content:center;padding:60px}
.spin{width:34px;height:34px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- login ---------- */
.screen{min-height:100vh;padding:20px}
.login-card{background:var(--card);border-radius:20px;box-shadow:0 10px 40px rgba(20,40,70,.12);padding:36px 30px;max-width:420px;width:100%;text-align:center}
.logo{width:64px;height:64px;border-radius:18px;background:var(--primary);color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.login-card h1{margin:0 0 4px;font-size:22px}
.login-card p{margin:0 0 22px;color:var(--muted)}
.gbtn{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;font-weight:700;cursor:pointer}
.gbtn:hover{border-color:var(--primary)}
.login-msg{margin-top:16px;font-size:13px;color:var(--danger);word-break:break-all}
.setup-box{margin-top:16px;text-align:left;background:var(--warn-l);border-radius:12px;padding:12px 14px;font-size:13px}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--card);border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:30;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand .logo{width:38px;height:38px;border-radius:11px;font-size:19px;margin:0}
.brand b{font-size:16px}
.brand small{display:block;color:var(--muted);font-size:11px}
.nav{padding:6px 10px;overflow:auto;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--text);text-decoration:none;font-weight:600;margin-bottom:2px}
.nav a:hover{background:var(--bg)}
.nav a.active{background:var(--primary-l);color:var(--primary)}
.nav .ico{width:22px;text-align:center}
.nav .badge-n{margin-left:auto;background:var(--danger);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px}
.side-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.main{flex:1;margin-left:236px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar h2{margin:0;font-size:18px;flex:1}
.menu-btn{display:none}
.who{font-size:12px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#content{padding:22px;max-width:1400px}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.card h3{margin:0 0 4px;font-size:16px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stat .lab{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat .val{font-size:26px;font-weight:800;margin:4px 0 2px}
.stat .note{font-size:12px;color:var(--muted)}
.stat.green .val{color:var(--primary)} .stat.red .val{color:var(--danger)} .stat.amber .val{color:var(--warn)} .stat.blue .val{color:var(--info)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{opacity:.9;color:#fff}
.btn.ghost-danger{color:var(--danger)} .btn.ghost-danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px 8px}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:14px;font-family:inherit;outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
textarea.input{min-height:80px;resize:vertical}
.field{margin-bottom:13px}
.field label{display:block;font-weight:700;margin-bottom:5px;font-size:13px}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .input{width:auto;min-width:160px}
.toolbar .grow{flex:1;min-width:200px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.b-green{background:var(--primary-l);color:var(--primary)} .b-red{background:var(--danger-l);color:var(--danger)}
.b-amber{background:var(--warn-l);color:#B7791F} .b-blue{background:var(--info-l);color:var(--info)} .b-grey{background:var(--bg);color:var(--muted)}
body.dark .b-amber{color:#F6C65B}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{background:var(--bg);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:11px 14px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(15,169,88,.03)}
.u-cell{display:flex;align-items:center;gap:10px;min-width:180px}
.av{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.u-name{font-weight:700} .u-mail{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;color:var(--muted);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.tab .c{opacity:.85;margin-left:4px}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;background:#C9D2DC;border-radius:24px;transition:.2s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + i{background:var(--primary)}
.switch input:checked + i:before{transform:translateX(18px)}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--border);cursor:pointer}
.sw-row:last-child{border-bottom:none}
.sw-row small{display:block;color:var(--muted)}
.bars{display:flex;gap:6px;height:170px;align-items:stretch}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bar-wrap{flex:1;display:flex;align-items:flex-end;width:100%}
.bar{width:100%;border-radius:6px 6px 0 0;min-height:2px}
.bar-val{font-size:10px;color:var(--muted);height:14px}
.bar-lab{font-size:10px;color:var(--muted);height:16px;white-space:nowrap}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv b{color:var(--muted);font-weight:600}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.list-item .grow{flex:1;min-width:0}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:2px 7px;border-radius:6px;font-size:12px}
.warn-box{background:var(--warn-l);border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:14px}
.danger-box{background:var(--danger-l);border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:14px;color:var(--danger)}

/* ---------- modal + toast ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:480px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:780px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:17px}
.modal-body{padding:18px 20px;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#1B2430;color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:13px;opacity:0;transform:translateY(10px);transition:.25s;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:none}
.toast.ok{background:var(--primary)} .toast.err{background:var(--danger)} .toast.warn{background:#B7791F}

@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .sidebar{transform:translateX(-100%)} .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .main{margin-left:0} .menu-btn{display:inline-flex} #content{padding:14px}
  .g2,.g3,.row2,.row3{grid-template-columns:1fr} .row7{grid-template-columns:repeat(4,1fr)}
  .who{display:none}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div id="toasts"></div>

<!-- ============ LOGIN ============ -->
<div id="screenLogin" class="screen center hidden">
  <div class="login-card">
    <div class="logo">C</div>
    <h1>Cash Mint BD</h1>
    <p>Admin Panel &mdash; sign in with an admin Google account</p>
    <button class="gbtn" id="btnGoogle">Continue with Google</button>
    <div class="login-msg" id="loginMsg"></div>
    <div class="setup-box hidden" id="setupBox"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="screenApp" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">C</div><div><b>Cash Mint BD</b><small>Admin Panel</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div id="footWho"></div></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="btn sm menu-btn" data-act="toggleMenu">&#9776;</button>
      <h2 id="pageTitle">Dashboard</h2>
      <span class="who" id="topWho"></span>
      <button class="btn sm" data-act="refreshAll" title="Reload data">&#8635; Refresh</button>
      <button class="btn sm" data-act="toggleTheme" title="Dark / light">&#9788;</button>
      <button class="btn sm ghost-danger" data-act="logout">Logout</button>
    </header>
    <main id="content"></main>
  </div>
</div>

<script>
'use strict';

/* =====================================================================
   1) আপনার Firebase Web কনফিগ এখানে বসান
   Firebase Console -> Project settings -> General -> Your apps -> Web app (</>) -> Config
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDnktj2XGaaHxOe_TDPVneK1E9qQgeRwp0",
  authDomain: "cashmint-bd.firebaseapp.com",
  databaseURL: "https://cashmint-bd-default-rtdb.firebaseio.com",
  projectId: "cashmint-bd",
  projectId: "cashmint-bd",
  appId: "1:405255230469:web:f68ab1081444633108b86c"
};

/* ============================ helpers ============================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const fmt = n => num(n).toLocaleString('en-US');
const taka = n => '\u09F3' + num(n).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
const fmtTime = ms => ms ? new Date(ms).toLocaleString('en-GB', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '-';
const fmtDate = ms => ms ? new Date(ms).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}) : '-';
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
const chk = id => { const e = document.getElementById(id); return !!(e && e.checked); };
const intv = id => parseInt(val(id), 10);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const initial = n => (n && String(n).trim() ? String(n).trim()[0].toUpperCase() : 'U');
const isUrl = u => /^https?:\/\/\S+$/i.test(u);

let auth, db, TS;
const S = { user: null, users: null, wd: {}, page: 'dashboard', config: null };
const P = {
  users: { q: '', status: 'all', sort: 'new', page: 1, size: 25 },
  wd: { status: 'pending', q: '', method: 'all', page: 1, size: 30 }
};
const pages = {};
const ACT = {};
const BIND = {};

/* ============================ ui helpers ============================ */
function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3600);
}
function errToast(e) { console.error(e); toast((e && e.message) ? e.message : String(e), 'err'); }

function openModal(o) {
  closeModal();
  const m = document.createElement('div');
  m.className = 'modal-back';
  m.id = 'modal';
  m.innerHTML = '<div class="modal ' + (o.wide ? 'wide' : '') + '"><div class="modal-head"><h3>' + esc(o.title) + '</h3><button class="icon-btn" data-act="closeModal">&#10005;</button></div><div class="modal-body">' + o.body + '</div>' + (o.footer ? '<div class="modal-foot">' + o.footer + '</div>' : '') + '</div>';
  document.body.appendChild(m);
  m.addEventListener('mousedown', e => { if (e.target === m) { closeModal(); if (o.onClose) o.onClose(); } });
  const x = m.querySelector('[data-act="closeModal"]');
  if (x && o.onClose) x.addEventListener('click', o.onClose);
  return m;
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }

function confirmBox(message, o) {
  o = o || {};
  return new Promise(res => {
    openModal({
      title: o.title || 'Confirm',
      body: '<p class="pre">' + esc(message) + '</p>',
      footer: '<button class="btn" id="cb_no">Cancel</button><button class="btn ' + (o.danger ? 'danger' : 'primary') + '" id="cb_yes">' + esc(o.okText || 'Confirm') + '</button>',
      onClose: () => res(false)
    });
    $('#cb_no').onclick = () => { closeModal(); res(false); };
    $('#cb_yes').onclick = () => { closeModal(); res(true); };
  });
}
function typedConfirm(message, word) {
  return new Promise(res => {
    openModal({
      title: 'Danger zone',
      body: '<div class="danger-box">' + esc(message) + '</div><div class="field"><label>Type <b>' + esc(word) + '</b> to continue</label><input class="input" id="tc_in" autocomplete="off"></div>',
      footer: '<button class="btn" id="tc_no">Cancel</button><button class="btn danger" id="tc_yes">Delete</button>',
      onClose: () => res(false)
    });
    $('#tc_no').onclick = () => { closeModal(); res(false); };
    $('#tc_yes').onclick = () => {
      if (val('tc_in') !== word) { toast('Text does not match', 'warn'); return; }
      closeModal(); res(true);
    };
  });
}

function setContent(html) { $('#content').innerHTML = html; }
function loading() { setContent('<div class="center-pad"><div class="spin"></div></div>'); }
function errBox(e) { return '<div class="card"><h3>Something went wrong</h3><p class="muted">' + esc((e && e.message) || e) + '</p></div>'; }

function badge(text, color) { return '<span class="badge b-' + color + '">' + esc(text) + '</span>'; }
function statusBadge(s) {
  if (s === 'paid' || s === 'active') return badge(s, 'green');
  if (s === 'rejected' || s === 'banned') return badge(s, 'red');
  if (s === 'pending') return badge(s, 'amber');
  return badge(s || '-', 'grey');
}
function pager(total, page, size, act) {
  const pages_ = Math.max(1, Math.ceil(total / size));
  return '<div class="pager"><span>' + fmt(total) + ' items &middot; Page ' + page + ' of ' + pages_ + '</span><span class="actions">' +
    '<button class="btn sm" data-act="' + act + '" data-d="-1" ' + (page <= 1 ? 'disabled' : '') + '>&larr; Prev</button>' +
    '<button class="btn sm" data-act="' + act + '" data-d="1" ' + (page >= pages_ ? 'disabled' : '') + '>Next &rarr;</button></span></div>';
}
function downloadCSV(name, rows) {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = rows.map(r => r.map(q).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => toast('Copied', 'ok'), () => toast('Copy failed', 'err'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied', 'ok'); } catch (e) { toast('Copy failed', 'err'); }
    ta.remove();
  }
}
function lastDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
    const s = d.getTime();
    out.push({ start: s, end: s + 86400000, label: d.getDate() + '/' + (d.getMonth() + 1) });
  }
  return out;
}
function barChart(vals, labels, color) {
  const max = Math.max(1, ...vals);
  return '<div class="bars">' + vals.map((v, i) =>
    '<div class="bar-col" title="' + esc(labels[i]) + ': ' + v + '"><div class="bar-val">' + (v || '') + '</div><div class="bar-wrap"><div class="bar" style="height:' + Math.round(v / max * 100) + '%;background:' + color + '"></div></div><div class="bar-lab">' + esc(labels[i]) + '</div></div>'
  ).join('') + '</div>';
}

/* form field builders */
const F = {
  text: (id, label, v, hint, ph) => '<div class="field"><label for="' + id + '">' + label + '</label><input class="input" id="' + id + '" value="' + esc(v) + '" placeholder="' + esc(ph || '') + '">' + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>',
  num: (id, label, v, hint, extra) => '<div class="field"><label for="' + id + '">' + label + '</label><input class="input" type="number" id="' + id + '" value="' + esc(v) + '" ' + (extra || '') + '>' + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>',
  area: (id, label, v, hint, extra) => '<div class="field"><label for="' + id + '">' + label + '</label><textarea class="input" id="' + id + '" ' + (extra || '') + '>' + esc(v) + '</textarea>' + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>',
  sw: (id, label, v, hint) => '<label class="sw-row"><span>' + label + (hint ? '<small>' + hint + '</small>' : '') + '</span><span class="switch"><input type="checkbox" id="' + id + '" ' + (v ? 'checked' : '') + '><i></i></span></label>',
  sel: (id, label, v, opts) => '<div class="field"><label for="' + id + '">' + label + '</label><select class="input" id="' + id + '">' + opts.map(o => '<option value="' + esc(o[0]) + '" ' + (o[0] === v ? 'selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select></div>'
};

/* ============================ admin log ============================ */
function logAction(action, target, details) {
  try {
    db.ref('adminLogs').push({ action: action, target: target || '', details: details || '', by: (S.user && (S.user.email || S.user.uid)) || '', uid: S.user ? S.user.uid : '', time: TS });
  } catch (e) { /* ignore */ }
}

/* ============================ data loaders ============================ */
async function getUsers(force) {
  if (!S.users || force) {
    const snap = await db.ref('users').once('value');
    S.users = snap.val() || {};
  }
  return S.users;
}
function usersArr() {
  return Object.keys(S.users || {}).map(uid => Object.assign({}, S.users[uid], { uid: uid }));
}
async function getConfig(force) {
  if (!S.config || force) {
    const snap = await db.ref('config').once('value');
    S.config = snap.val() || {};
  }
  return S.config;
}
function wdArr() {
  return Object.keys(S.wd || {}).map(id => Object.assign({}, S.wd[id], { id: id }));
}
function methodLabel(w) {
  const m = w.method === 'bkash' ? 'bKash' : w.method === 'nagad' ? 'Nagad' : 'Recharge';
  const ops = { gp: 'Grameenphone', bl: 'Banglalink', robi: 'Robi', airtel: 'Airtel' };
  return m + (w.method === 'recharge' && w.operator ? ' \u2022 ' + (ops[w.operator] || w.operator) : '');
}

/* ============================ boot / auth ============================ */
function showLogin(msg) {
  $('#screenApp').classList.add('hidden');
  $('#screenLogin').classList.remove('hidden');
  $('#loginMsg').textContent = msg || '';
}
function showApp() {
  $('#screenLogin').classList.add('hidden');
  $('#screenApp').classList.remove('hidden');
  $('#topWho').textContent = S.user.email || S.user.uid;
  $('#footWho').textContent = 'Signed in as ' + (S.user.email || S.user.uid);
  buildNav();
  startWithdrawListener();
  route();
}

function boot() {
  if (localStorage.getItem('cm_dark') === '1') document.body.classList.add('dark');
  $('#btnGoogle').onclick = () => {
    $('#loginMsg').textContent = '';
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(e => {
      if (e && e.code === 'auth/popup-blocked') { auth.signInWithRedirect(provider); return; }
      $('#loginMsg').textContent = e.message;
    });
  };
  if (JSON.stringify(FIREBASE_CONFIG).indexOf('YOUR_') !== -1) {
    $('#screenLogin').classList.remove('hidden');
    const b = $('#setupBox');
    b.classList.remove('hidden');
    b.innerHTML = '<b>Setup needed</b><br>Open this file in a text editor and paste your Firebase Web config into <span class="code">FIREBASE_CONFIG</span> (near the top of the script).';
    $('#btnGoogle').disabled = true;
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.database();
  TS = firebase.database.ServerValue.TIMESTAMP;

  auth.onAuthStateChanged(async user => {
    if (!user) { S.user = null; showLogin(); return; }
    try {
      const snap = await db.ref('admins/' + user.uid).once('value');
      if (!snap.exists()) throw new Error('not admin');
    } catch (e) {
      const uid = user.uid;
      await auth.signOut();
      showLogin('This account is not an admin. Your UID: ' + uid + ' \u2014 add it in Firebase Console: Realtime Database -> admins -> ' + uid + ' = true');
      return;
    }
    S.user = user;
    showApp();
  });
}

let wdRef = null;
function startWithdrawListener() {
  if (wdRef) wdRef.off();
  wdRef = db.ref('withdraws').orderByChild('time').limitToLast(500);
  wdRef.on('value', snap => {
    S.wd = snap.val() || {};
    updateBadges();
    if (S.page === 'withdrawals' && $('#wdBody')) refreshWd();
    if (S.page === 'dashboard' && $('#dashPending')) pages.dashboard();
  }, e => errToast(e));
}
function updateBadges() {
  const n = wdArr().filter(w => w.status === 'pending').length;
  const el = $('#navBadge');
  if (el) { el.textContent = n; el.classList.toggle('hidden', n === 0); }
}

/* ============================ nav + router ============================ */
const NAV = [
  ['dashboard', '\uD83D\uDCCA', 'Dashboard'],
  ['users', '\uD83D\uDC65', 'Users'],
  ['withdrawals', '\uD83D\uDCB8', 'Withdrawals'],
  ['tasks', '\u2705', 'Tasks'],
  ['promo', '\uD83C\uDFAB', 'Promo Codes'],
  ['notifications', '\uD83D\uDD14', 'Notifications'],
  ['referrals', '\uD83E\uDD1D', 'Referrals'],
  ['control', '\u2699\uFE0F', 'App Control'],
  ['logs', '\uD83D\uDCDC', 'Logs & Admins']
];
function buildNav() {
  $('#nav').innerHTML = NAV.map(n =>
    '<a href="#/' + n[0] + '" data-page="' + n[0] + '"><span class="ico">' + n[1] + '</span>' + n[2] + (n[0] === 'withdrawals' ? '<span class="badge-n hidden" id="navBadge">0</span>' : '') + '</a>'
  ).join('');
  updateBadges();
}
async function route() {
  let p = (location.hash || '').replace(/^#\/?/, '') || 'dashboard';
  if (!pages[p]) p = 'dashboard';
  S.page = p;
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.page === p));
  const nv = NAV.filter(n => n[0] === p)[0];
  $('#pageTitle').textContent = nv ? nv[2] : 'Dashboard';
  $('#sidebar').classList.remove('open');
  loading();
  try { await pages[p](); } catch (e) { console.error(e); setContent(errBox(e)); }
}
window.addEventListener('hashchange', () => { if (S.user) route(); });

      '<div class="stat green"><div class="lab">Active users</div><div class="val">' + fmt(total - banned) + '</div><div class="note">' + fmt(banned) + ' banned</div></div>' +
      '<div class="stat amber"><div class="lab">Coins in circulation</div><div class="val">' + fmt(coins) + '</div><div class="note">&asymp; ' + taka(coins / rate) + ' liability</div></div>' +
      '<div class="stat red" id="dashPending"><div class="lab">Pending withdrawals</div><div class="val">' + fmt(pend.length) + '</div><div class="note">' + taka(pendSum) + ' to pay</div></div>' +
    '</div>' +
    '<div class="grid g4" style="margin-bottom:18px">' +
      '<div class="stat green"><div class="lab">Total paid out</div><div class="val">' + taka(paidSum) + '</div><div class="note">last 500 requests</div></div>' +
      '<div class="stat"><div class="lab">Rejected</div><div class="val">' + fmt(wds.filter(w => w.status === 'rejected').length) + '</div><div class="note">requests</div></div>' +
      '<div class="stat"><div class="lab">Coin rate</div><div class="val">' + fmt(rate) + '</div><div class="note">coins = ' + taka(1) + '</div></div>' +
      '<div class="stat ' + (maint ? 'red' : 'green') + '"><div class="lab">App status</div><div class="val" style="font-size:20px">' + (maint ? 'MAINTENANCE' : 'LIVE') + '</div><div class="note">' + (maint ? 'Users are blocked' : 'Users can use the app') + '</div></div>' +
    '</div>' +

/* ============================ USERS ============================ */
pages.users = async function () {
  setContent(
    '<div class="toolbar">' +
      '<input class="input grow" id="uQ" placeholder="Search name, email, UID or referral code" data-bind="usersQ" value="' + esc(P.users.q) + '">' +
      '<select class="input" data-bind="usersStatus"><option value="all">All status</option><option value="active"' + (P.users.status === 'active' ? ' selected' : '') + '>Active</option><option value="banned"' + (P.users.status === 'banned' ? ' selected' : '') + '>Banned</option></select>' +
      '<select class="input" data-bind="usersSort">' + [['new', 'Newest'], ['old', 'Oldest'], ['coinHigh', 'Coins: high'], ['coinLow', 'Coins: low'], ['name', 'Name A-Z']].map(o => '<option value="' + o[0] + '"' + (P.users.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>' +
      '<button class="btn" data-act="usersCsv">Export CSV</button>' +
    '</div><div id="usersBody"></div>'
  );
  await getUsers();
  refreshUsers();
};
function filteredUsers() {
  const q = P.users.q.toLowerCase();
  let a = usersArr();
  if (P.users.status !== 'all') a = a.filter(u => (u.status || 'active') === P.users.status);
  if (q) a = a.filter(u => [u.name, u.email, u.uid, u.referCode].some(x => String(x || '').toLowerCase().indexOf(q) !== -1));
  const s = P.users.sort;
  a.sort((x, y) => s === 'new' ? num(y.createdAt) - num(x.createdAt) : s === 'old' ? num(x.createdAt) - num(y.createdAt) : s === 'coinHigh' ? num(y.coin) - num(x.coin) : s === 'coinLow' ? num(x.coin) - num(y.coin) : String(x.name || '').localeCompare(String(y.name || '')));
  return a;
}
function refreshUsers() {
  const body = $('#usersBody');
  if (!body) return;
  const a = filteredUsers();
  const maxPage = Math.max(1, Math.ceil(a.length / P.users.size));
  if (P.users.page > maxPage) P.users.page = maxPage;
  const slice = a.slice((P.users.page - 1) * P.users.size, P.users.page * P.users.size);
  if (!a.length) { body.innerHTML = '<div class="card empty">No users found</div>'; return; }
  body.innerHTML = '<div class="table-wrap"><table><thead><tr><th>User</th><th>Coins</th><th>Cash</th><th>Streak</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead><tbody>' +
    slice.map(u =>
      '<tr><td><div class="u-cell"><div class="av">' + esc(initial(u.name)) + '</div><div><div class="u-name">' + esc(u.name || 'User') + '</div><div class="u-mail">' + esc(u.email || '') + '</div></div></div></td>' +
      '<td><b>' + fmt(u.coin) + '</b></td><td>' + taka(u.cash) + '</td><td>' + fmt(u.streak) + '</td><td>' + statusBadge(u.status || 'active') + '</td><td>' + fmtDate(u.createdAt) + '</td>' +
      '<td><div class="actions"><button class="btn sm" data-act="viewUser" data-uid="' + esc(u.uid) + '">View</button>' +
      '<button class="btn sm" data-act="coinUser" data-uid="' + esc(u.uid) + '">Coins</button>' +
      (u.status === 'banned' ? '<button class="btn sm primary" data-act="banUser" data-uid="' + esc(u.uid) + '" data-ban="0">Unban</button>' : '<button class="btn sm ghost-danger" data-act="banUser" data-uid="' + esc(u.uid) + '" data-ban="1">Ban</button>') +
      '</div></td></tr>'
    ).join('') + '</tbody></table></div>' + pager(a.length, P.users.page, P.users.size, 'usersPage');
}
BIND.usersQ = debounce(v => { P.users.q = v; P.users.page = 1; refreshUsers(); }, 200);
BIND.usersStatus = v => { P.users.status = v; P.users.page = 1; refreshUsers(); };
BIND.usersSort = v => { P.users.sort = v; P.users.page = 1; refreshUsers(); };
ACT.usersPage = d => { P.users.page += parseInt(d.d, 10); refreshUsers(); };
ACT.usersCsv = () => {
  const rows = [['uid', 'name', 'email', 'coin', 'cash', 'status', 'streak', 'referCode', 'referredBy', 'createdAt']];
  filteredUsers().forEach(u => rows.push([u.uid, u.name, u.email, u.coin || 0, u.cash || 0, u.status || 'active', u.streak || 0, u.referCode || '', u.referredBy || '', u.createdAt ? new Date(u.createdAt).toISOString() : '']));
  downloadCSV('users.csv', rows);
};

async function setBan(uid, ban) {
  const u = (S.users || {})[uid];
  const name = u ? (u.name || u.email || uid) : uid;
  const ok = await confirmBox((ban ? 'Ban ' : 'Unban ') + name + '?', { danger: ban, okText: ban ? 'Ban user' : 'Unban' });
  if (!ok) return;
  try {
    await db.ref('users/' + uid + '/status').set(ban ? 'banned' : 'active');
    if (S.users[uid]) S.users[uid].status = ban ? 'banned' : 'active';
    logAction(ban ? 'ban' : 'unban', uid, name);
    toast(ban ? 'User banned' : 'User unbanned', 'ok');
    closeModal();
    if (S.page === 'users') refreshUsers();
    if (S.page === 'referrals') pages.referrals();
  } catch (e) { errToast(e); }
}
ACT.banUser = d => setBan(d.uid, d.ban === '1');
ACT.viewUser = d => openUser(d.uid);
ACT.coinUser = d => coinModal(d.uid);

  openModal({ title: 'User details', wide: true, body: '<div class="center-pad"><div class="spin"></div></div>' });
  let hist = [], promo = {};
  try { const h = await db.ref('history/' + uid).orderByChild('time').limitToLast(15).once('value'); hist = Object.values(h.val() || {}).sort((a, b) => num(b.time) - num(a.time)); } catch (e) { /* ignore */ }
  try { const p = await db.ref('promoUsed/' + uid).once('value'); promo = p.val() || {}; } catch (e) { /* ignore */ }
  const wds = wdArr().filter(w => w.uid === uid).sort((a, b) => num(b.time) - num(a.time));

function coinModal(uid) {
  const u = S.users[uid];
  if (!u) return;
  openModal({
    title: 'Adjust coins - ' + (u.name || u.email || uid),
    body: '<div class="muted" style="margin-bottom:12px">Current balance: <b>' + fmt(u.coin) + '</b> coins</div>' +
      F.sel('ca_mode', 'Action', 'add', [['add', 'Add coins (shown in user history)'], ['sub', 'Subtract coins'], ['set', 'Set exact balance']]) +
      F.num('ca_amt', 'Amount (coins)', '', '', 'min="0" step="1"') + F.text('ca_reason', 'Reason / note', '', 'Shown to the user in history for "Add"'),
    footer: '<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="ca_go">Apply</button>'
  });
  $('#ca_go').onclick = async () => {
    const mode = val('ca_mode');

  a.sort((x, y) => P.wd.status === 'pending' ? num(x.time) - num(y.time) : num(y.time) - num(x.time));

}
function refreshWd() {
  const top = $('#wdTop'), body = $('#wdBody');
  if (!top || !body) return;

      '<div class="stat red"><div class="lab">Rejected</div><div class="val">' + taka(sum('rejected')) + '</div><div class="note">' + cnt('rejected') + ' requests</div></div>' +

  const a = filteredWd();

  if (P.wd.page > maxPage) P.wd.page = maxPage;
  const slice = a.slice((P.wd.page - 1) * P.wd.size, P.wd.page * P.wd.size);

  body.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Requested</th><th>User</th><th>Method</th><th>Number</th><th>Amount</th><th>Coins</th><th>Status</th><th>Actions</th></tr></thead><tbody>' +
    slice.map(w => {
      const old = w.status === 'pending' && now - num(w.time) > 72 * 3600000;
      return '<tr><td>' + fmtTime(w.time) + (old ? '<div style="color:var(--danger);font-size:11px;font-weight:700">&gt; 72h waiting</div>' : '') + '</td>' +
        '<td><div class="u-name">' + esc(w.name || 'User') + '</div><div class="u-mail">' + esc(w.email || '') + '</div></td>' +
        '<td>' + esc(methodLabel(w)) + '</td>' +
        '<td><span class="code">' + esc(w.number) + '</span> <button class="btn sm" data-act="copy" data-t="' + esc(w.number) + '">Copy</button></td>' +
        '<td><b>' + taka(w.amountTaka) + '</b></td><td>' + fmt(w.coins) + '</td><td>' + statusBadge(w.status) + '</td>' +
        '<td><div class="actions">' + (w.status === 'pending'
          ? '<button class="btn sm primary" data-act="payWd" data-id="' + esc(w.id) + '">Pay</button><button class="btn sm ghost-danger" data-act="rejectWd" data-id="' + esc(w.id) + '">Reject</button>'
          : '<button class="btn sm" data-act="wdInfo" data-id="' + esc(w.id) + '">Details</button>') +
        '<button class="btn sm" data-act="viewUser" data-uid="' + esc(w.uid) + '">User</button></div></td></tr>';
    }).join('') + '</tbody></table></div>' + pager(a.length, P.wd.page, P.wd.size, 'wdPage');
}

  openModal({

  });

ACT.rejectWd = d => {
  const w = S.wd[d.id]; if (!w) return;
  if (w.status !== 'pending') { toast('Already processed', 'warn'); return; }
  openModal({
    title: 'Reject withdrawal',
    body: wdSummary(w) + F.sel('rj_pre', 'Reason', 'Wrong number', [['Wrong number', 'Wrong number'], ['Suspicious activity', 'Suspicious activity'], ['Policy violation', 'Policy violation'], ['Other', 'Other']]) + F.text('rj_note', 'Extra note (optional)', '', '') + F.sw('rj_refund', 'Refund ' + fmt(w.coins) + ' coins to the user', true, 'Turn off only if the user cheated'),
    footer: '<button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" id="rj_go">Reject</button>'
  });
  $('#rj_go').onclick = async () => {

    try {
      const reason = val('rj_pre') + (val('rj_note') ? ' - ' + val('rj_note') : '');
      const ok = await processWd(d.id, 'rejected', { rejectReason: reason }, chk('rj_refund'));
      if (ok) { closeModal(); toast('Rejected', 'ok'); } else { $('#rj_go').disabled = false; }
    } catch (e) { errToast(e); $('#rj_go').disabled = false; }
  };
};
async function processWd(id, status, extra, refund) {
  const w = S.wd[id];
  if (!w) return false;
  const sref = db.ref('withdraws/' + id);
  const res = await sref.child('status').transaction(cur => cur === 'pending' ? status : undefined);
  if (!res.committed) { toast('This request was already processed', 'warn'); return false; }
  const upd = Object.assign({ processedAt: TS, processedBy: (S.user.email || S.user.uid) }, extra || {});
  if (status === 'rejected') upd.refunded = !!refund;
  await sref.update(upd);
  if (status === 'paid') {
    await db.ref('users/' + w.uid + '/cash').transaction(c => num(c) + num(w.amountTaka));
  } else if (status === 'rejected' && refund) {
    await db.ref('users/' + w.uid + '/coin').transaction(c => num(c) + num(w.coins));
    await db.ref('history/' + w.uid).push({ type: 'refund', title: 'Withdraw refund (' + taka(w.amountTaka) + ')', coins: num(w.coins), time: TS });
  }
  logAction('withdraw_' + status, w.uid, taka(w.amountTaka) + ' ' + methodLabel(w) + ' ' + w.number + (extra && extra.trxId ? ' trx:' + extra.trxId : ''));
  S.users = null;
  return true;
}

function parseRewards(str) {
  const out = [];
  const parts = String(str || '').split(',');
  for (let i = 0; i < parts.length; i++) {
    const t = parts[i].trim();
    if (!t) continue;
    const m = t.match(/^(\d+)\s*:\s*(\d+)$/);
    if (!m) return null;
    const c = parseInt(m[1], 10), w = parseInt(m[2], 10);
    if (c < 1 || c > 500 || w < 1) return null;
    out.push({ c: c, w: w });
  }
  return out.length ? out : null;
}
function rewardStats(str) {
  const r = parseRewards(str);
  if (!r) return 'Invalid format. Use coins:weight pairs, e.g. 2:40,5:30,10:15 (coins 1-500)';
  const tw = r.reduce((a, x) => a + x.w, 0);
  const avg = r.reduce((a, x) => a + x.c * x.w, 0) / tw;
  const rate = num(S.config && S.config.economy && S.config.economy.coinPerTaka) || 100;
  return 'Average reward: ' + avg.toFixed(2) + ' coins (about ' + taka(avg / rate) + ') per play. Chances: ' + r.map(x => x.c + ' coins ' + (x.w / tw * 100).toFixed(1) + '%').join(', ');
}
function cleanPacks(str, name, required) {
  const seen = {};
  const arr = [];
  String(str || '').split(',').forEach(p => {
    const n = parseInt(p.trim(), 10);
    if (isFinite(n) && n >= 20 && !seen[n]) { seen[n] = 1; arr.push(n); }
  });
  arr.sort((a, b) => a - b);
  if (required && !arr.length) throw new Error(name + ': enter at least one amount (each 20 or more), e.g. 50,100,200');
  return arr.join(',');
}

ACT.saveCfg = async d => {

      if (val('c_mail') && val('c_mail').indexOf('@') === -1) throw new Error('Support email looks wrong');
      path = 'config/app';
      data = { maintenance: chk('c_maint'), maintenanceMessage: val('c_maintMsg'), minVersionCode: minV, updateUrl: urlOk(val('c_updUrl'), 'Play Store link'), updateMessage: val('c_updMsg'), notice: val('c_notice'), supportEmail: val('c_mail'), privacyUrl: urlOk(val('c_privacy'), 'Privacy Policy URL'), termsUrl: urlOk(val('c_terms'), 'Terms URL') };
      if (data.maintenance && !(await confirmBox('Maintenance is ON. All users will be blocked right now. Continue?', { danger: true, okText: 'Save' }))) return;
    } else if (sec === 'economy') {
      const rate = intv('c_rate');
      if (!isFinite(rate) || rate < 1) throw new Error('Coins per Taka must be a whole number (1 or more)');
      const minw = num(val('c_minw'));
      if (minw < 0) throw new Error('Minimum withdraw cannot be negative');
      const streak = [];
      for (let i = 1; i <= 7; i++) streak.push(bonusV('c_s' + i, 'Day ' + i + ' bonus'));
      path = 'config/economy';
      data = { coinPerTaka: rate, minWithdrawTaka: minw, dailyStreak: streak.join(','), welcomeBonus: bonusV('c_welcome', 'Welcome bonus'), referrerBonus: bonusV('c_refer', 'Referrer bonus'), referredBonus: bonusV('c_referred', 'Referred bonus') };
      const old = num(S.config && S.config.economy && S.config.economy.coinPerTaka);
      if (old && old !== rate && !(await confirmBox('You are changing the coin rate from ' + old + ' to ' + rate + '. Every user\'s coins will be worth a different amount of Taka. Continue?', { danger: true, okText: 'Change rate' }))) return;
    } else if (sec === 'withdraw') {
      path = 'config/withdraw';
      data = {
        note: val('c_wnote'),
        'bkash/enabled': chk('c_bk_on'), 'bkash/packs': cleanPacks(val('c_bk_packs'), 'bKash', chk('c_bk_on')),
        'nagad/enabled': chk('c_ng_on'), 'nagad/packs': cleanPacks(val('c_ng_packs'), 'Nagad', chk('c_ng_on')),

      };
    } else if (sec === 'features') {
      path = 'config/features';
      FEATS.forEach(f => { data[f[0]] = chk('f_' + f[0]); });
    } else if (sec === 'games') {
      path = 'config/games';
      GAMES.forEach(g => {
        const lim = intv('c_g_' + g[0] + '_lim');

      });
    } else if (sec === 'ads') {
      const rmin = intv('a_min'), rmax = intv('a_max'), lim = intv('a_lim');
      if (!isFinite(rmin) || !isFinite(rmax) || rmin < 0 || rmax < rmin || rmax > 500) throw new Error('Reward must be 0-500 and max must be at least min');
      if (!isFinite(lim) || lim < 0) throw new Error('Daily limit must be 0 or more');
      path = 'config/ads';
      data = { enabled: chk('a_on'), appId: val('a_app'), rewardedUnitId: val('a_rew'), bannerUnitId: val('a_ban'), interstitialUnitId: val('a_int'), dailyAdLimit: lim, rewardMin: rmin, rewardMax: rmax };
    } else { return; }

    await db.ref(path).update(data);
    S.config = null;
    logAction('config_' + sec, path, JSON.stringify(data).slice(0, 300));
    toast('Saved. The app uses the new values now.', 'ok');
  } catch (e) { errToast(e); }
};

/* ============================ LOGS & ADMINS ============================ */
pages.logs = async function () {
  await getUsers();
  const res = await Promise.all([db.ref('adminLogs').orderByChild('time').limitToLast(100).once('value'), db.ref('admins').once('value')]);
  const lo = res[0].val() || {};
  const ao = res[1].val() || {};
  const logs = Object.keys(lo).map(id => lo[id]).sort((a, b) => num(b.time) - num(a.time));
  const admins = Object.keys(ao);
  setContent(
    '<div class="card"><h3>Admins</h3><p class="sub">Only these accounts can open this panel. To add or remove an admin, edit <span class="code">admins</span> in Firebase Console -> Realtime Database (UID = true).</p>' +
      (admins.map(uid => {
        const u = S.users[uid];
        return '<div class="list-item"><div class="av">' + esc(initial(u ? u.name : 'A')) + '</div><div class="grow"><b>' + esc(u ? (u.name || u.email) : 'Admin') + '</b>' + (uid === S.user.uid ? ' ' + badge('you', 'green') : '') + '<div class="muted" style="font-size:12px"><span class="code">' + esc(uid) + '</span></div></div></div>';
      }).join('') || '<div class="empty">No admins found</div>') + '</div>' +
    '<div class="card"><h3>Admin activity log</h3><p class="sub">Latest 100 actions</p>' +
      (logs.length ? '<div class="table-wrap"><table><thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>' +
        logs.map(l => '<tr><td style="white-space:nowrap">' + fmtTime(l.time) + '</td><td>' + esc(l.by) + '</td><td>' + badge(l.action, /ban|delete|reject|maintenance/.test(l.action || '') ? 'red' : /paid|add|unban/.test(l.action || '') ? 'green' : 'blue') + '</td><td><span class="code">' + esc(String(l.target || '').slice(0, 28)) + '</span></td><td class="muted" style="max-width:380px;word-break:break-word">' + esc(l.details) + '</td></tr>').join('') +
        '</tbody></table></div>' : '<div class="empty">No actions logged yet</div>') + '</div>'
  );
};

/* ============================ global wiring ============================ */
ACT.closeModal = () => closeModal();
ACT.toggleMenu = () => $('#sidebar').classList.toggle('open');
ACT.toggleTheme = () => { document.body.classList.toggle('dark'); localStorage.setItem('cm_dark', document.body.classList.contains('dark') ? '1' : '0'); };
ACT.refreshAll = () => { S.users = null; S.config = null; route(); toast('Reloading data...', 'ok'); };
ACT.logout = async () => { if (wdRef) wdRef.off(); await auth.signOut(); };

document.addEventListener('click', e => {
  const el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  try {
    const r = fn(el.dataset, el);
    if (r && typeof r.catch === 'function') r.catch(errToast);
  } catch (err) { errToast(err); }
});
['input', 'change'].forEach(ev => document.addEventListener(ev, e => {
  const t = e.target;
  if (!t || !t.dataset) return;
  if (t.dataset.bind && BIND[t.dataset.bind]) BIND[t.dataset.bind](t.value, t);
  if (t.dataset.rew) { const h = document.getElementById(t.dataset.rew); if (h) h.textContent = rewardStats(t.value); }
}));

boot();

</script>
